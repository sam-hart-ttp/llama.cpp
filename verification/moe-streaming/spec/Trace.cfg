SPECIFICATION TraceSpec

\* Strings, not model values: every value in these sets is compared against
\* strings produced by ndJsonDeserialize, and a model value never equals one.
CONSTANTS
    TraceThreads = {"cpu0", "fill0"}
    Slots = {"s1", "s2"}
    Experts = {"e1", "e2"}
    MaxGeneration = 3
    AllowPinnedEviction = FALSE
    AllowStalePublish = FALSE
    AllowEarlySkip = FALSE

INVARIANTS
    TypeOK
    NoReadersOfUnpublishedSlots
    PublishedGenerationIsCurrent
    PinnedExpertIsStable
    SkippedRowsAreBacked
    CompletedResultsAreCorrect

PROPERTIES
    TraceFullyConsumed
